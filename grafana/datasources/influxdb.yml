apiVersion: 1

datasources:
  - name: InfluxDB-JMeter
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: ${INFLUXDB_ORG:-performance}
      defaultBucket: ${INFLUXDB_BUCKET:-jmeter}
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUXDB_TOKEN:-jmeter-token-2024-super-secret}
    uid: influxdb-jmeter
    isDefault: true
    editable: true
