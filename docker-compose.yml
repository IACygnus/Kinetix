version: '3.8'

services:
  # ========================================
  # BASE DE DATOS - PostgreSQL
  # ========================================
  postgres:
    image: postgres:15-alpine
    container_name: jmeter_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jmeter_user
      POSTGRES_PASSWORD: jmeter_secure_2024
      POSTGRES_DB: jmeter_analyzer_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - jmeter_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jmeter_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # BACKEND - FastAPI (Puerto 8001)
  # ========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jmeter_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://jmeter_user:jmeter_secure_2024@postgres:5432/jmeter_analyzer_db
      - SECRET_KEY=bKp_8xN9mQ2vR5wZ1aE7fH3jL6kM0nY4cT2sW8dX1gV5pU9iO3hB7eN0qA4rJ6m
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - BACKEND_PORT=8001
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    ports:
      - "8001:8001"
    networks:
      - jmeter_network
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  # ========================================
  # FRONTEND - React (Puerto 5173)
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jmeter_frontend
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=http://localhost:8001/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - jmeter_network
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    stdin_open: true
    tty: true

  # ========================================
  # ✨ NUEVO: InfluxDB - Tiempo Real
  # ========================================
  influxdb:
    image: influxdb:2.7-alpine
    container_name: jmeter_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin123
      - DOCKER_INFLUXDB_INIT_ORG=performance
      - DOCKER_INFLUXDB_INIT_BUCKET=jmeter
      - DOCKER_INFLUXDB_INIT_RETENTION=30d
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=jmeter-token-2024-super-secret
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - jmeter_network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # ✨ NUEVO: Grafana - Visualización
  # ========================================
  grafana:
    image: grafana/grafana:10.2.3
    container_name: jmeter_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - jmeter_network
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

# ========================================
# NETWORKS
# ========================================
networks:
  jmeter_network:
    driver: bridge

# ========================================
# VOLUMES
# ========================================
volumes:
  postgres_data:
  uploads_data:
  influxdb_data:      # ✨ NUEVO
  influxdb_config:    # ✨ NUEVO
  grafana_data:       # ✨ NUEVO
