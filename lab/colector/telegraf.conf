# lab_colector - el recolector SIN AGENTE del laboratorio (O-D10).
#
# Telegraf oficial, con la version fijada en el Dockerfile. No instala nada en
# los servidores que mira: al Linux le entra por SSH y a PostgreSQL por su
# puerto, con un rol de solo lectura.
#
# Los secretos no viven aqui: llegan por entorno desde `docker-compose.lab.yml`.

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "1s"
  precision = "1s"
  # El nombre del RECOLECTOR no le importa a nadie: lo que se mira es el
  # servidor observado. Cada metrica trae su propia etiqueta `host`.
  omit_hostname = true

[global_tags]
  cliente = "${KX_CLIENTE}"
  # O-D13: `sin_agente` en toda la etapa O2a. En O2b, el agente escribira
  # `agente` y las dos series conviviran con el mismo nombre de campo.
  modo = "sin_agente"
  # `corrida` vive en telegraf.d/00-corrida.conf, que se reescribe entre
  # pruebas y se recarga con una senal, sin reiniciar el contenedor.

# ===========================================================================
# SALIDA - InfluxDB, cubo `infra` (O-D15)
# ===========================================================================
[[outputs.influxdb_v2]]
  urls = ["${KX_INFLUX_URL}"]
  token = "${KX_INFLUX_TOKEN}"
  organization = "${KX_INFLUX_ORG}"
  bucket = "${KX_INFLUX_BUCKET}"

# ===========================================================================
# LINUX SIN AGENTE, por SSH (O-D11)
# ===========================================================================
# El programa escribe protocolo de linea con los nombres de los complementos
# nativos, asi que para Telegraf esto es `cpu`, `mem`, `disk`, `diskio`, `net`,
# `system` y `processes` de toda la vida.
[[inputs.exec]]
  commands = ["python3 /opt/kinetix/linux_sin_agente.py"]
  timeout = "9s"
  data_format = "influx"

# ===========================================================================
# POSTGRESQL SIN AGENTE, por conexion (O-D12)
# ===========================================================================
# Medida `postgresql`, la nativa: conexiones, transacciones y cache.
[[inputs.postgresql]]
  address = "${KX_PG_DSN}"
  outputaddress = "lab_db"
  ignored_databases = ["template0", "template1"]
  [inputs.postgresql.tags]
    host = "lab_db"

# Lo que la nativa no trae - bloqueos, consultas lentas y tamano - sale por
# `postgresql_extensible`, que tambien es nativa: la maquinaria es de Telegraf,
# solo el SQL es nuestro.
[[inputs.postgresql_extensible]]
  address = "${KX_PG_DSN}"
  outputaddress = "lab_db"
  [inputs.postgresql_extensible.tags]
    host = "lab_db"

  [[inputs.postgresql_extensible.query]]
    measurement = "postgresql_actividad"
    withdbname = false
    tagvalue = "estado"
    sqlquery = '''
SELECT state AS estado,
       count(*)::int8 AS conexiones,
       COALESCE(max(EXTRACT(EPOCH FROM (now() - query_start))), 0)::float8 AS consulta_mas_larga_s,
       COALESCE(max(EXTRACT(EPOCH FROM (now() - xact_start))), 0)::float8 AS transaccion_mas_larga_s
FROM pg_stat_activity
WHERE backend_type = 'client backend' AND state IS NOT NULL
GROUP BY state
'''

  [[inputs.postgresql_extensible.query]]
    measurement = "postgresql_bloqueos"
    withdbname = false
    # `tipo`, no `modo`: `modo` ya es la etiqueta global de O-D13 (sin_agente /
    # agente) y la columna se la comia — estas filas salian con
    # `modo=AccessShareLock` en vez de `modo=sin_agente`.
    tagvalue = "tipo"
    sqlquery = '''
SELECT mode AS tipo,
       count(*)::int8 AS cuantos,
       (count(*) FILTER (WHERE NOT granted))::int8 AS esperando
FROM pg_locks
GROUP BY mode
'''

  [[inputs.postgresql_extensible.query]]
    measurement = "postgresql_consultas_lentas"
    withdbname = false
    tagvalue = "consulta"
    sqlquery = '''
SELECT left(regexp_replace(query, '\s+', ' ', 'g'), 120) AS consulta,
       calls::int8 AS llamadas,
       mean_exec_time::float8 AS media_ms,
       max_exec_time::float8 AS maxima_ms,
       total_exec_time::float8 AS total_ms,
       rows::int8 AS filas
FROM pg_stat_statements
WHERE calls > 1
ORDER BY mean_exec_time DESC
LIMIT 10
'''

  [[inputs.postgresql_extensible.query]]
    measurement = "postgresql_tamano"
    withdbname = false
    tagvalue = "base"
    sqlquery = '''
SELECT datname AS base,
       pg_database_size(datname)::int8 AS bytes
FROM pg_database
WHERE datistemplate = false
'''

# ===========================================================================
# CONTENEDORES (O-D16)
# ===========================================================================
# Esto pide el socket de Docker, y el socket de Docker es la maquina entera.
# En el laboratorio se hace; a un cliente no se le pide sin decirle lo que
# significa. Esta escrito en docs/observabilidad/requisitos-sin-agente.md.
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  container_name_include = ["lab_servidor", "lab_db"]
  perdevice = false
  total = false
  timeout = "8s"
  # Sin esto, Telegraf convierte CADA etiqueta de Docker en una etiqueta de la
  # metrica: veinticinco por punto, incluidas las rutas absolutas del equipo
  # (`desktop.docker.io/binds/0/Source` = C:\proyectos\Kinetix\...). Es
  # cardinalidad que no sirve para nada y es una fuga: en la base de metricas
  # de un cliente no tienen por que quedar las rutas de nadie.
  docker_label_include = []
  docker_label_exclude = ["*"]
  [inputs.docker.tags]
    host = "lab_docker"
