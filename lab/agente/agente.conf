# Agente Kinetix — la configuracion que genera Kinetix (O-D17).
#
# Es Telegraf 1.29, el mismo de siempre, corriendo DENTRO del servidor. Escribe
# con el esquema de O-D13 —los mismos nombres de medida y de campo que el modo
# sin agente— y se distingue por una sola etiqueta: `modo = "agente"`.
#
# Ningun secreto vive aqui. El token llega por entorno desde
# /etc/kinetix-agente/entorno, que es del usuario del agente y nadie mas lee.

[agent]
  # O-D18: cada segundo. El modo sin agente va a diez, y esa es toda la
  # diferencia que se mide en O2b.2.
  interval = "1s"
  round_interval = true
  collection_jitter = "0s"
  precision = "1s"

  # Se envia cada cinco segundos: los datos siguen teniendo un segundo de
  # resolucion, solo se agrupan para no abrir una conexion por lectura.
  flush_interval = "5s"
  flush_jitter = "0s"
  metric_batch_size = 2000

  # O-D22 — el colchon para un corte de red. 50.000 metricas a ~16 por segundo
  # son unos cincuenta minutos sin conexion sin perder nada. No se reserva por
  # adelantado: en reposo el agente no gasta esa memoria.
  metric_buffer_limit = 50000

  # El nombre de la maquina lo pone el instalador, para que coincida EXACTAMENTE
  # con el que usa el modo sin agente. Si no, serian dos servidores distintos.
  omit_hostname = true

[global_tags]
  host = "${KX_HOST}"
  cliente = "${KX_CLIENTE}"
  modo = "agente"
  # `corrida` vive en conf.d/00-corrida.conf y se recarga con una senal.

[[outputs.influxdb_v2]]
  urls = ["${KX_INFLUX_URL}"]
  token = "${KX_INFLUX_TOKEN}"
  organization = "${KX_INFLUX_ORG}"
  bucket = "${KX_INFLUX_BUCKET}"

# ===========================================================================
# LO QUE MIDE
# ===========================================================================
# Todos son complementos NATIVOS, sin configuracion rara: por eso los nombres
# coinciden con los del modo sin agente sin tener que hacer nada.

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  report_active = false

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "squashfs", "aufs",
               "nsfs", "cgroup", "cgroup2", "9p", "drvfs"]

[[inputs.diskio]]

[[inputs.net]]

[[inputs.system]]

[[inputs.processes]]

[[inputs.swap]]

[[inputs.kernel]]

# ===========================================================================
# LO QUE **NO** MIDE, Y POR QUE (O-D19)
# ===========================================================================
# El agente corre como `kinetix_agente`, sin `sudo` y sin grupos. Lo que no se
# puede leer asi NO se consigue subiendo permisos: se declara.
#
#   inputs.docker    exige pertenecer al grupo `docker`, que equivale a ser
#                    administrador de la maquina. Fuera.
#   inputs.smart     exige `sudo smartctl`. Fuera.
#   inputs.procstat  lee `/proc/<pid>/io` de procesos de OTROS usuarios, y eso
#                    pide CAP_SYS_PTRACE. Fuera: daria campos vacios y
#                    parecerian datos.
#   inputs.ethtool   exige CAP_NET_ADMIN. Fuera.
#
# Esta escrito, con la misma lista, en docs/observabilidad/requisitos-con-agente.md
